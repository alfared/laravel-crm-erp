version: "3.9"

services:
  app:
    build:
      context: ./docker/php
    user: "${UID}:${GID}"
    container_name: crm_app
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:latest
    container_name: crm_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: crm_db
    restart: always
    environment:
      MYSQL_DATABASE: crm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: crm_redis
    ports:
      - "6379:6379"

  node:
    image: node:20
    container_name: crm_node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    ports:
      - "5173:5173"
    command: tail -f /dev/null

volumes:
  db_data: