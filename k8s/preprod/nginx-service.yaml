apiVersion: v1
kind: Service
metadata:
  name: crm-nginx
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: crm-nginx
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: crm-nginx

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
