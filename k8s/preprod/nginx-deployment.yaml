apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-nginx
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: crm-nginx
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: crm-nginx

  template:
    metadata:
      labels:
        app.kubernetes.io/name: crm-nginx
        app.kubernetes.io/part-of: laravel-crm
        environment: preprod

    spec:
      containers:
        - name: nginx
          image: crm-nginx:production
          imagePullPolicy: IfNotPresent

          env:
            - name: PHP_FPM_UPSTREAM
              value: "crm-app:9000"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
