apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-app-config
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: crm-app
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8082"

  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"

  DB_CONNECTION: "mysql"
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_DATABASE: "crm"

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
