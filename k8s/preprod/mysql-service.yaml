apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: mysql

  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: mysql
