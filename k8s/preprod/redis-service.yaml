apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: redis

  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
