apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-app
  namespace: crm-preprod
  labels:
    app.kubernetes.io/name: crm-app
    app.kubernetes.io/part-of: laravel-crm
    environment: preprod

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: crm-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: crm-app
        app.kubernetes.io/part-of: laravel-crm
        environment: preprod

    spec:
      containers:
        - name: app
          image: crm-app:production
          imagePullPolicy: IfNotPresent

          ports:
            - name: fastcgi
              containerPort: 9000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: crm-app-config

            - secretRef:
                name: crm-app-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "kill -0 1"
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
